name: CI

# 内容校验 → 后端回归 → 前端构建。
# 只跑仓库里真实存在的脚本：backend/scripts/validate_content.py、pytest、npm run build。
# 不引 ruff / eslint（尚未接入项目依赖），也不做媒体体积检查（validate_content 已含单文件与总量上限）。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 内容校验 + 后端回归 + 前端构建
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: 安装后端依赖
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: 内容校验（0 错误才算过）
        run: python backend/scripts/validate_content.py

      # pytest.ini 在仓库根：testpaths=backend/tests，conftest.py 会把 backend/ 加进 sys.path，
      # 所以从仓库根直接跑即可，不需要额外的 PYTHONPATH 或工作目录切换。
      - name: 后端回归测试
        run: python -m pytest -q

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        run: npm ci --prefix frontend

      # build = tsc --noEmit && vite build；prebuild 会先复制 Pyodide 运行时副本
      - name: 前端构建
        run: npm run build --prefix frontend
